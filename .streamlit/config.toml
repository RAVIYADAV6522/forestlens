[server]
# Sample crops are ~1.5-10 MB; a full ARD tile would not fit in a small host's memory.
maxUploadSize = 40

[browser]
gatherUsageStats = false

[theme]
# Native widgets (sliders, checkboxes, tab underline) pick these up, so they match the
# forest palette in app/theme.py instead of Streamlit's default coral red.
base = "light"
primaryColor = "#1F6B47"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9F8"
textColor = "#10201A"
